<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예약 가능한 낚시 일정</title>
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #scheduleTable { width: 100%; }
    </style>
</head>
<body>
    <h1>예약 가능한 낚시 일정</h1>
    <table id="scheduleTable" class="display">
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- jQuery and DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            fetch('available_schedules.csv')
                .then(response => response.text())
                .then(data => {
                    const rows = data.trim().split('\n');
                    const header = rows[0].split(',');
                    
                    // 테이블 헤더
                    const headerRow = $('#tableHeader');
                    header.forEach(h => headerRow.append(`<th>${h}</th>`));

                    // 테이블 바디
                    const tbody = $('#tableBody');
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i].split(',');
                        let rowHtml = '<tr>';
                        cells.forEach(c => rowHtml += `<td>${c}</td>`);
                        rowHtml += '</tr>';
                        tbody.append(rowHtml);
                    }

                    // DataTables 초기화
                    $('#scheduleTable').DataTable({
                        language: {
                            search: "검색:",
                            lengthMenu: "_MENU_ 개씩 보기",
                            info: "_START_ - _END_ / 총 _TOTAL_ 건",
                            paginate: {
                                first: "처음",
                                last: "끝",
                                next: "다음",
                                previous: "이전"
                            }
                        }
                    });
                });
        });
    </script>
</body>
</html>
